[package]
name = "life-storage-admission"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "life_storage_admission"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[target.'cfg(target_arch = "riscv32")'.dependencies]
thruput-sdk = { workspace = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
thruput-sdk = { workspace = true, features = ["std"] }

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]
