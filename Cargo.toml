cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"

members = [
    "contracts/game-of-life",
    "helpers/game-of-life-core",
    "helpers/game-of-life-indexer",
    "sim-fixtures/life-storage-admission",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Chain of Life contributors"]
publish = false
repository = "https://github.com/chambaz/chainoflife"
homepage = "https://thruput.network"
keywords = ["thruput"]
categories = ["blockchain"]

[workspace.dependencies]
# from sdk_rs repo:
thruput-sdk = { version = "=0.60.0" }
thruput-contract-util = { package = "thruput-contract-util", version = "=0.60.0" }

# from thruput-rpc repo:
thruput-json-rpc-client = { package = "thruput-json-rpc-client", version = "=0.43.0" }
thruput-json-rpc-types = { package = "thruput-json-rpc-types", version = "=0.43.0" }

# Protocol types:
thruput-xdr = { package = "thruput-xdr", version = "=0.65.0", features = ["serde", "xdrs"] }
xdrs = { package = "thruput-xdrs", version = "=0.18.0", features = ["alloc"] }

# from crates.io:
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"

[profile.release]
trim-paths = "all" # unstable
