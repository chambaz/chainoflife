name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  applications:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [game-of-life, game-of-life-renderer-fixture]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npm run test:chromium

  contracts:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install Rust tooling
        run: |
          rustup show
          rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked -p game-of-life-core -p game-of-life-indexer
      - run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
      - name: Verify guest builds and generated bindings
        run: |
          cargo install --version 0.43.0 --locked thruput
          export THRUPUT_CLI="$(command -v thruput)"
          npm --prefix apps/game-of-life ci
          npm --prefix apps/game-of-life run check:contracts
          thruput build -p life-storage-admission -- --locked
