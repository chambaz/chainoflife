name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  applications:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [".", "tests/renderer"]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.directory == '.'
        run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npm run test:chromium

  contracts:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Rust toolchain
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo test --locked -p game-of-life-core -p game-of-life-indexer
      - run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
      - name: Verify the contract build and generated bindings
        run: |
          cargo install --version 0.45.0 --locked thruput
          export THRUPUT_CLI="$(command -v thruput)"
          npm ci
          npm run check:contracts
